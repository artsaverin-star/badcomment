# TEMPORARY (2026-10-13): hands the runtime secrets that only lived in GitHub over to the new
# KZ box, encrypted to a one-off key whose private half never leaves the owner's Mac.
# Removed right after use.
name: Export secrets (encrypted)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Encrypt to the one-off key
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SIWA_KEY_ID: ${{ secrets.SIWA_KEY_ID }}
          SIWA_PRIVATE_KEY_B64: ${{ secrets.SIWA_PRIVATE_KEY_B64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir out
          cat > pub.pem <<'PEM'
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAo71HlmF39YTYTxfXVaCY
            DYrET76IbI2j3xp8wSbKz0s+oSZu+eEmKJv0+bmG16Bm0Dalp0w0z0DuaQ0adpVj
            rvYJWdtt4TodS0tzWPtWcVslGBM06W+aKrQQrUeVBGVLjjPdkUgqXQHU5AMCVR5/
            yNV7gfvCtQ+cD2pURDDC7FaQ58NswcZ5ihRgwV898deuLq/Fxl2VaK3A6sSVj/t0
            Nv+NpxT3JQ5lclI0qrSULcKJWnEOAwt7pouqMlvpWgqOBAoxePO4KYO2moUx5pP1
            zZrWpEvDgxupsjK5bngxQQxLwCE2j6PmeqN9G+ISTyHhsMyU1wYP6rdv8JTOOrGa
            yz5arU18jOINijCE3JfYyGz47QpPn2eJH27OwD7N5rg11f93yTyfpF7/UlBCEH0v
            oGO5dZ1zN51vRz+ou3bcaA17Nqk/rNey1C69cWvqM8P9ZMxuN8xADNuPRXUYlB/Z
            urwIYlftrgl5XLoxHVejsK5dBWpJYEh46ZS8sxRjras9trMw+CrA3muruzg7phTK
            ZLtOgtINwQrv3DhWPilQK0ZXYMHjWrc9OML+zfOZ1S8+IDByiwGU73DznVMywWrX
            eNhJrPxwD5HpYKSCGDON+jMjha+MVeK2jmjtZYClRz7+Mi0Ai8KecbH1rQc8d0MZ
            P+9flYF/pUXGcOLY3ldcwAsCAwEAAQ==
            -----END PUBLIC KEY-----
          PEM
          sed -i 's/^ *//' pub.pem
          { printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
            printf 'SIWA_KEY_ID=%s\n' "$SIWA_KEY_ID"
            printf 'SIWA_PRIVATE_KEY_B64=%s\n' "$SIWA_PRIVATE_KEY_B64"
            printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID"; } > secrets.env
          openssl rand -out key.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in secrets.env -out out/secrets.env.enc -pass file:key.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in key.bin -out out/key.bin.enc
          rm -f secrets.env key.bin
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: secrets-encrypted
          path: out/
          retention-days: 1
