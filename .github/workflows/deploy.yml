name: Deploy

# CI on every push/PR; deploy to the prod VM only on push to main, and only
# once the box is wired up (set repo variable DEPLOY_ENABLED=true + the secrets
# listed below). Until then the deploy job is skipped, so merging is always safe.
#
# The prod box has only 2GB RAM and OOM-kills `next build`, which also corrupts
# the live .next mid-build. So the build runs HERE (on the runner, plenty of
# RAM); the box only receives the finished .next and restarts. Nothing is built
# on the box.
#
# Required to enable deploys (Settings → Secrets and variables → Actions):
#   Variable  DEPLOY_ENABLED     = true
#   Secret    DEPLOY_HOST        = 51.250.11.225
#   Secret    DEPLOY_USER        = artsaverin
#   Secret    DEPLOY_SSH_KEY     = <private key whose public half is in the box's authorized_keys>
#   Secret    DEPLOY_KNOWN_HOSTS = <output of: ssh-keyscan -t ed25519 51.250.11.225>

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  # Run JS-based actions on Node 24 (silences the Node 20 deprecation warning).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:mcp
      - run: npm run test:monetization
      - run: npm run test:aso
      - name: Build (.next) on the runner, not the prod box
        run: npm run build
        env:
          # Build never connects to the DB (all pages are force-dynamic), but a
          # valid-looking URL keeps PrismaClient construction at import happy.
          DATABASE_URL: "file:./ci.db"
          # Public Google OAuth client id (NEXT_PUBLIC_* is inlined at build).
          # Set repo variable GOOGLE_CLIENT_ID to switch on the Google sign-in
          # button; empty = button hidden, Telegram login still works.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          # Email magic-link sign-in. Set repo variable EMAIL_LOGIN_ENABLED=1 to
          # show the email form (also needs the YC_SMTP_* secrets below, else the
          # server returns "disabled"). Empty = form hidden, other logins work.
          NEXT_PUBLIC_EMAIL_LOGIN: ${{ vars.EMAIL_LOGIN_ENABLED }}
      - name: Package the build for the box
        run: tar -czf next-build.tgz --exclude='.next/cache' .next
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tgz
          retention-days: 2

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Upload the prebuilt .next to the box
        run: |
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            next-build.tgz \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/badcomment/next-build.tgz"
      - name: Sync runtime secrets to the box (.env)
        # Re-writes the managed keys on every deploy: delete the old line, append
        # the current secret. Empty secrets append a blank value (harmless — the
        # feature just stays off until the secret is set).
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo touch /opt/badcomment/.env \
             && sudo sed -i '/^GOOGLE_CLIENT_SECRET=/d;/^YC_SMTP_USER=/d;/^YC_SMTP_PASS=/d' /opt/badcomment/.env \
             && { printf 'GOOGLE_CLIENT_SECRET=%s\n' '${{ secrets.GOOGLE_CLIENT_SECRET }}'; \
                  printf 'YC_SMTP_USER=%s\n' '${{ secrets.YC_SMTP_USER }}'; \
                  printf 'YC_SMTP_PASS=%s\n' '${{ secrets.YC_SMTP_PASS }}'; } | sudo tee -a /opt/badcomment/.env > /dev/null"
      - name: Swap in the build and restart (no build on the box)
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/badcomment && bash deploy/deploy.sh'
      - name: Ping IndexNow (Bing / Yandex)
        run: |
          sleep 60
          curl -s -m 30 "https://inapp.pro/api/indexnow" || true

      - name: Smoke-test production
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
            -o /tmp/mcp-page.html https://inapp.pro/ru/mcp
          grep -q 'list_niche_themes' /tmp/mcp-page.html
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
            -o /tmp/mcp-oauth.json https://inapp.pro/.well-known/oauth-authorization-server
          grep -q '"refresh_token"' /tmp/mcp-oauth.json
          status="$(curl -sS --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
            -o /tmp/mcp-smoke.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"deploy-smoke","version":"1"}}}' \
            https://inapp.pro/api/mcp)"
          test "${status}" = "401"
          grep -q 'authorization_required' /tmp/mcp-smoke.json
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
            -o /tmp/access-page.html https://inapp.pro/ru/tokens
          grep -q '990' /tmp/access-page.html
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
            -o /tmp/aso-page.html https://inapp.pro/ru/aso
          grep -q 'Roomdo: Visual To-Do List' /tmp/aso-page.html
          pay_status="$(curl -sS --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
            -o /tmp/pay-status.json -w '%{http_code}' \
            'https://inapp.pro/api/pay/status?checkout=00000000-0000-0000-0000-000000000000')"
          test "${pay_status}" = "401"
