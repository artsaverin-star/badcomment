# nginx site for inapp.pro: the Next.js app (systemd unit `badcomment`, port 3000), on the
# Yandex Cloud Kazakhstan VM it shares with Roomdo since 2026-10-11. Roomdo's own site keeps
# default_server on 80/443 (its IP certificate); this file only answers for inapp.pro.
#
# This is the live file: deploy/tls-kz.sh installs it as /etc/nginx/sites-available/inapp.pro
# once the certificate exists (certbot certonly --webroot, renewed by Roomdo's certbot timer,
# whose deploy hook reloads nginx). deploy.sh does not touch it. To change it: edit here, then
#   python3 deploy/kz_ssh.py --put deploy/nginx-badcomment.conf:/tmp/inapp-nginx.conf -- sudo bash -s < deploy/tls-kz.sh
# No http2: on nginx 1.24 it is a property of the whole 443 socket, so it would switch Roomdo
# too. If a location gets its own add_header, repeat any server-level ones in it.

# Reuse connections to Node instead of opening one per request. Node closes idle
# keep-alive sockets after 5 s, so nginx must drop them first (4 s).
upstream badcomment_next {
    server 127.0.0.1:3000;
    keepalive 16;
    keepalive_timeout 4s;
}

# `Connection: upgrade` only for real WebSocket upgrades; otherwise no Connection header,
# so the upstream keep-alive above works. Named per site to avoid clashing with a global map.
map $http_upgrade $badcomment_connection {
    default upgrade;
    ''      '';
}

# Port 80: ACME challenges, everything else to the canonical https host.
server {
    listen 80;
    listen [::]:80;
    server_name inapp.pro www.inapp.pro;

    location ^~ /.well-known/acme-challenge/ { root /var/www/inapp-acme; }
    location / { return 301 https://inapp.pro$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.inapp.pro;
    ssl_certificate /etc/letsencrypt/live/inapp.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inapp.pro/privkey.pem;
    return 301 https://inapp.pro$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name inapp.pro;
    ssl_certificate /etc/letsencrypt/live/inapp.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inapp.pro/privkey.pem;

    # Scraper on Tencent Cloud Singapore (whois ACEVILLE PTE.LTD.) since 2026-10-18: headless
    # Chrome through ~1 500 rotating addresses, and every page it loaded showed up in GA as a new
    # "Singapore" user. Denied here, before the page and its analytics script. The port-80 and
    # www servers `return` before access rules run, so they only redirect it here.
    deny 43.172.0.0/15;

    # Compression for the files nginx serves itself. Next already compresses what it sends,
    # and nginx leaves responses that already have a Content-Encoding alone.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/manifest+json application/xml image/svg+xml font/ttf font/otf;

    # Inherited by every proxy_pass below. A location that sets its own proxy_set_header
    # would lose all of these, so none does.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $badcomment_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Build output with content-hashed names (the same header Next sends), straight from
    # disk. deploy.sh swaps .next with `mv`, so this always points at the live build.
    location ^~ /_next/static/ {
        alias /opt/badcomment/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # public/ folders whose files change only with a deploy (names are not hashed): one week,
    # the same value next.config.ts headers() sets when Node serves them. A file nginx
    # can't find goes to Node, which answers exactly as before.
    location ~ ^/(?:media|brand|badges)/ {
        root /opt/badcomment/public;
        try_files $uri @next;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
    }

    location / {
        proxy_pass http://badcomment_next;
    }

    location @next {
        proxy_pass http://badcomment_next;
    }
}
