# nginx site for inapp.pro: the Next.js app (systemd unit `badcomment`, 127.0.0.1:3000).
#
# Reference copy. deploy.sh does NOT install it; setup.sh copies it once on a fresh box, then
# `certbot --nginx` edits the live file (/etc/nginx/sites-available/badcomment): it adds the
# `listen 443 ssl` + certificate lines to the server block below and a separate port-80
# redirect block. So the live file differs from this one. To apply a change here by hand:
#   1. Merge the `upstream` and `map` blocks and the server-level settings and locations below
#      into the live file. Keep certbot's lines; make its listens
#        listen 443 ssl http2;  listen [::]:443 ssl http2;
#      (nginx 1.24 syntax; on nginx >= 1.25.1 use `http2 on;` instead).
#      If the live server block has its own `add_header` (e.g. HSTS), repeat it inside every
#      location below that has an `add_header`: a location with its own add_header drops the
#      server-level ones.
#   2. Check that nginx (www-data) can read the files it will now serve itself:
#        sudo -u www-data cat /opt/badcomment/public/badges/app-store.svg > /dev/null
#        sudo -u www-data ls /opt/badcomment/.next/static > /dev/null
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. curl -sI https://inapp.pro/badges/app-store.svg | grep -i cache-control   # max-age=604800
#      curl -sI --http2 https://inapp.pro/en | head -1                           # HTTP/2 200
#   5. Copy the live file back over this one so the repo stays true.

# Reuse connections to Node instead of opening one per request. Node closes idle
# keep-alive sockets after 5 s, so nginx must drop them first (4 s).
upstream badcomment_next {
    server 127.0.0.1:3000;
    keepalive 16;
    keepalive_timeout 4s;
}

# `Connection: upgrade` only for real WebSocket upgrades; otherwise no Connection header,
# so the upstream keep-alive above works. Named per site to avoid clashing with a global map.
map $http_upgrade $badcomment_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name inapp.pro www.inapp.pro;

    # Compression for the files nginx serves itself. Next already compresses what it sends,
    # and nginx leaves responses that already have a Content-Encoding alone.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/manifest+json application/xml image/svg+xml font/ttf font/otf;

    # Inherited by every proxy_pass below. A location that sets its own proxy_set_header
    # would lose all of these, so none does.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $badcomment_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Build output with content-hashed names (the same header Next sends), straight from
    # disk. deploy.sh swaps .next with `mv`, so this always points at the live build.
    location ^~ /_next/static/ {
        alias /opt/badcomment/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # public/ folders whose files change only with a deploy (names are not hashed): one week,
    # the same value next.config.ts headers() sets when Node serves them. A file nginx
    # can't find goes to Node, which answers exactly as before.
    location ~ ^/(?:media|brand|badges)/ {
        root /opt/badcomment/public;
        try_files $uri @next;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
    }

    location / {
        proxy_pass http://badcomment_next;
    }

    location @next {
        proxy_pass http://badcomment_next;
    }
}
